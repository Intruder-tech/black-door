name: BlackDoor
version: '${version}'
main: io.github.intruder_tech.blackdoor.platform.bukkit.BlackDoorBukkitPlugin
# Ignored by 1.8-1.12 servers; required so 1.13+ servers do not load the plugin in legacy mode.
api-version: '1.13'
folia-supported: true
softdepend: [packetevents]
description: Server security - packet and exploit guards, join limits and a login system. Start with /blackdoor setup.
authors: [Intruder-tech]
website: https://github.com/Intruder-tech
commands:
  blackdoor:
    description: Black Door administration
    usage: /blackdoor help
    aliases: [bd]
  signup:
    description: Create your account (login system)
    usage: /signup <password> <password>
  signin:
    description: Sign in to your account (login system)
    usage: /signin <password>
permissions:
  blackdoor.exempt.kick:
    description: Never kicked automatically by Black Door
    default: false
  blackdoor.command.auth:
    description: Reset a forgotten password (/blackdoor auth reset)
    default: op
  blackdoor.command.help:
    description: List Black Door commands
    default: op
  blackdoor.command.status:
    description: View Black Door status
    default: op
  blackdoor.command.version:
    description: View Black Door version information
    default: op
  blackdoor.command.reload:
    description: Reload Black Door configuration
    default: op
  blackdoor.command.diagnostics:
    description: View technical diagnostics
    default: op
  blackdoor.command.setup:
    description: Run the initial security check (/blackdoor setup)
    default: op
  blackdoor.command.gui:
    description: Open the in-game control panel (view only)
    default: op
  blackdoor.gui.edit:
    description: Change settings from the in-game control panel
    default: op
  blackdoor.command.checks:
    description: List checks and finding counts
    default: op
  blackdoor.command.player:
    description: Inspect a player's tracked state and findings
    default: op
  blackdoor.command.record:
    description: Record a player's movement for physics testing (writes files to plugins/BlackDoor/traces)
    default: op

# Black Door - checks
# Documentation: docs/DETECTION_REGISTRY.md and docs/CONFIGURATION.md
#
# Modes for every check:
#   disabled = check does not run
#   monitor  = findings are logged and counted only (default, recommended)
#   mitigate = the offending packet is blocked; only takes effect when config.yml mode is "enforce"
#
# Do not edit config-version; Black Door uses it to migrate this file safely.
config-version: 1

packet:
  # Coordinates that are NaN/infinite or beyond the world limits.
  invalid-position:
    mode: monitor
  # Pitch outside -90..90 or non-finite rotation (no vanilla client can send it).
  invalid-rotation:
    mode: monitor
  # Hotbar slot outside 0..8.
  invalid-slot:
    mode: monitor
  # Attacking or interacting with your own entity.
  self-interact:
    mode: monitor
  # Confirming a teleport the server never sent.
  teleport-confirm:
    mode: monitor
  # Packets or text larger than legitimate clients send.
  oversized:
    mode: monitor
    max-movement-bytes: 64
    max-chat-length: 256
    max-command-length: 32767
    max-tab-complete-length: 32500
  # Replies to Black Door's own connection checks (pings) that were never sent, or come back out of order.
  transaction:
    mode: monitor
  # Per-connection packet rates (burst = short-term allowance, per-second = sustained rate).
  # Changes apply to new connections.
  flood:
    mode: monitor
    movement:
      burst: 200
      per-second: 40
    interact:
      burst: 60
      per-second: 40
    text:
      burst: 50
      per-second: 20
    total:
      burst: 1000
      per-second: 500
  # Plugin messages (mod and client data). Raise max-bytes if a mod you allow needs more.
  payload:
    mode: monitor
    max-bytes: 32767
    max-channel-length: 128
    max-brand-bytes: 256
  # Book edits with too many pages or too much text.
  book:
    mode: monitor
    max-pages: 100
    max-page-length: 8192
    max-title-length: 32
  # Sign text with more than 4 lines or very long lines.
  sign:
    mode: monitor
    max-line-length: 384
  # Creative-mode inventory actions. Raise limits if plugins give players large custom items.
  creative-item:
    mode: monitor
    max-amount: 99
    max-bytes: 65536
  # Maximum number of connections tracked at once (memory bound). Restart required.
  max-sessions: 5000

# Black Door - checks
# Documentation: docs/DETECTION_REGISTRY.md and docs/CONFIGURATION.md
#
# Modes for every check:
#   disabled = check does not run
#   monitor  = findings are logged and counted only (default, recommended)
#   mitigate = the offending packet is blocked; only takes effect when config.yml mode is "enforce"
#
# Do not edit config-version; Black Door uses it to migrate this file safely.
config-version: 1

packet:
  # Coordinates that are NaN/infinite or beyond the world limits.
  invalid-position:
    mode: monitor
  # Pitch outside -90..90 or non-finite rotation (no vanilla client can send it).
  invalid-rotation:
    mode: monitor
  # Hotbar slot outside 0..8.
  invalid-slot:
    mode: monitor
  # Attacking or interacting with your own entity.
  self-interact:
    mode: monitor
  # Confirming a teleport the server never sent.
  teleport-confirm:
    mode: monitor
  # Packets or text larger than legitimate clients send.
  oversized:
    mode: monitor
    max-movement-bytes: 64
    max-chat-length: 256
    max-command-length: 32767
    max-tab-complete-length: 32500
  # Per-connection packet rates (burst = short-term allowance, per-second = sustained rate).
  # Changes apply to new connections.
  flood:
    mode: monitor
    movement:
      burst: 200
      per-second: 40
    interact:
      burst: 60
      per-second: 40
    text:
      burst: 50
      per-second: 20
    total:
      burst: 1000
      per-second: 500
  # Maximum number of connections tracked at once (memory bound). Restart required.
  max-sessions: 5000

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21 (runs Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Gradle provisions the JDK 25 build toolchain via the foojay resolver.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Build, unit tests, module-graph and source-rule checks
        run: ./gradlew build --console=plain
      - name: Upload distribution jars
        uses: actions/upload-artifact@v4
        with:
          name: blackdoor-jars
          path: |
            dist-bukkit/build/libs/BlackDoor-*.jar
            blackdoor-proxy-velocity/build/libs/BlackDoor-*.jar
            blackdoor-proxy-bungee/build/libs/BlackDoor-*.jar
          if-no-files-found: error
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'

  dependency-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Blocking: modules whose external runtime dependencies are shaded into the shipped jars
      # (today only SnakeYAML). A finding here affects Black Door itself.
      - name: Scan shipped dependencies (blocking)
        uses: google/osv-scanner-action/osv-scanner-action@v2.0.2
        with:
          scan-args: |-
            --lockfile=blackdoor-api/gradle.lockfile
            --lockfile=blackdoor-common/gradle.lockfile
            --lockfile=blackdoor-config/gradle.lockfile
            --lockfile=blackdoor-protocol/gradle.lockfile
            --lockfile=blackdoor-protocol-packetevents/gradle.lockfile
            --lockfile=blackdoor-violations/gradle.lockfile
            --lockfile=blackdoor-state/gradle.lockfile
            --lockfile=blackdoor-packets/gradle.lockfile
            --lockfile=blackdoor-core/gradle.lockfile
            --lockfile=dist-bukkit/gradle.lockfile
      # Informational: platform adapter lockfiles also list compile-only server/proxy APIs
      # (e.g. Spigot 1.8.8's guava 18 / snakeyaml 1.15). Those libraries are provided by the
      # server or proxy at runtime and are not shipped by Black Door.
      - name: Scan platform API dependencies (informational)
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@v2.0.2
        with:
          scan-args: |-
            --lockfile=blackdoor-platform-bukkit/gradle.lockfile
            --lockfile=blackdoor-platform-paper/gradle.lockfile
            --lockfile=blackdoor-proxy-velocity/gradle.lockfile
            --lockfile=blackdoor-proxy-bungee/gradle.lockfile
